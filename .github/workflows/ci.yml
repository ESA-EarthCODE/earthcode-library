name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: earthcode-library

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout earthcode-library
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: earthcode-library
          persist-credentials: false

      - name: Checkout open-science-catalog-metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ESA-EarthCODE/open-science-catalog-metadata
          path: open-science-catalog-metadata
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          working-directory: earthcode-library
          locked: true
          cache: true

      - name: Run test suite
        run: pixi run --locked -e default pytest
